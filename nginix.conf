server {
    listen 80;
    server_name _;
    
    # Privacy & Security Hardening
    server_tokens off;
    client_max_body_size 2M; # Strict payload limit to prevent resource exhaustion
    
    # Strict Content-Security-Policy: Blocks all external resources, scripts, and framing
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # High-Performance Static Cache Bypass (Serves directly from disk, bypassing Python)
    location /static/uploads/ {
        alias /var/www/marketplace/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'none';" always;
    }

    # Reverse Proxy to Python Backend via Unix Socket
    location / {
        proxy_pass unix:/tmp/marketplace.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
