server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2M;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Forwarded-Proto "https";

    location /static/uploads/ {
        alias /var/www/marketplace/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass unix:/tmp/sockets/marketplace.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
    }
}
